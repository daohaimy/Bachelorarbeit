# Run with `dart run ffigen --config ffigen.yaml`.
name: NativeAudioBindings
description: |
  Bindings for `src/native_audio.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/native_audio_bindings_generated.dart'
headers:
  entry-points:
    - 'src/native_audio.h'
  include-directives:
    - 'src/native_audio.h'
ffi-native:
  assetId: 'package:native_audio/audiokit'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
