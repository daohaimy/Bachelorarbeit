# Run with `dart run ffigen --config ffigen.yaml`.
name: NativeKontaktberichtBindings
description: |
  Bindings for `src/native_kontaktbericht.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/native_kontaktbericht_bindings_generated.dart'
headers:
  entry-points:
    - 'src/native_kontaktbericht.h'
  include-directives:
    - 'src/native_kontaktbericht.h'
ffi-native:
  assetId: 'package:native_kontaktbericht/kontaktbericht_logikkit'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
